version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: codeforge_redis
    ports:
      - "6379:6379"

  codeforge-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeforge_backend
    ports:
      - "8000:8000"
    volumes:
      - ./workspace:/app/workspace
    env_file:
      - .env
    environment:
      - WORKSPACE_DIR=/app/workspace
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  codeforge-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeforge_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - codeforge-backend
