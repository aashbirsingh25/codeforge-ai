version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codeforge_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=codeforge
      - POSTGRES_PASSWORD=codeforge
      - POSTGRES_DB=codeforge
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: codeforge_redis
    ports:
      - "6379:6379"

  codeforge-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeforge_backend
    ports:
      - "8000:8000"
    volumes:
      - ./workspace:/app/workspace
    env_file:
      - .env
    environment:
      - WORKSPACE_DIR=/app/workspace
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://codeforge:codeforge@postgres:5432/codeforge
    depends_on:
      - redis
      - postgres

  codeforge-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeforge_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - codeforge-backend

volumes:
  postgres_data:

